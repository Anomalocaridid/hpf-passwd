from_latest_tag = false
ignore_merge_commits = false
ignore_fixup_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = [
  # Update versions of scripts declared with argc
  "sed --in-place 's/^# @meta version {{latest|0.0.0}}$/# @meta version {{version}}/' ./src/*.sh",
  # Update version in package.nix
  "sed --in-place 's/^  version = \"{{latest|0.0.0}}\";$/  version = \"{{version}}\";/' ./package.nix",
]
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]
